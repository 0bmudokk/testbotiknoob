const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const inR=(x,y,r)=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;
const clampN=(v,a,b)=>Math.max(a,Math.min(b,v));
function clampP(u){
 if(isNaN(u.x)||isNaN(u.y)){u.x=u.team==='P'?120:780;u.y=LANE;}
 u.x=Math.max(MINX,Math.min(MAXX,u.x));
 u.y=Math.max(LANE-LH,Math.min(LANE+LH,u.y));
}
function mvT(u,pt,dt){
 if(u.stunTime>0)return;
 const dx=pt.x-u.x,dy=pt.y-u.y,d=Math.hypot(dx,dy);
 if(d<1||isNaN(d))return;
 let sp=(u.speed||0)+(u.items?u.items.speed:0)+(u.passives?.wings?50:0);
 if(u.hasteTime>0)sp*=u.hasteMult;
 if(u.wingTimer>0)sp*=1.2;
 if(u.slowTime>0)sp*=(1-u.slowAmount);
 if(!isFinite(sp)||sp<=0)return;
 const step=Math.min(sp*dt,d);
 u.x+=dx/d*step;u.y+=dy/d*step;clampP(u);
}
function uR(u){
 if(u.type==='ancient')return 34;
 if(u.type==='tower')return 24;
 if(u.type==='hero')return 22;
 return u.isSummon?12:22;
}

function genDecor(){

  const side=i%2===0?-1:1;
  const x=50+Math.random()*(W-100);

  if(y<80||y>H-50)continue;
  arr.push({x,y,r:16+Math.random()*12,type:'tree'});
 }
 for(let i=0;i<24;i++){

function updProj(dt){
 for(let i=S.projectiles.length-1;i>=0;i--){
  const p=S.projectiles[i];
  if(!p.target||p.target.hp<=0||p.target.alive===false){S.projectiles.splice(i,1);continue;}
  p.tx=p.target.x;p.ty=p.target.y;
  const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);

 }
}

function applyDmg(tg,dmg,killer,silent){
 if(!tg||tg.hp<=0||!isFinite(dmg)||dmg<=0)return;
 // Крипы наносят героям (игроку и боту) половину обычного урона.
 if(killer&&killer.type==='creep'&&tg.type==='hero')dmg*=0.5;
 if(killer&&killer.type==='hero'&&killer!==tg){
  const pk=killer.heroDef.perk;
  if(pk==='rage'&&killer.hp/killer.maxHp<0.4)dmg*=1.15;
  if(pk==='sniper'&&d2(killer,tg)>150)dmg*=1.25;
 }
 if(tg.passives?.armor)dmg*=0.85;
 if(tg.items?.damageReduction)dmg*=1-tg.items.damageReduction;
 if(tg.heroDef&&tg.heroDef.perk==='stone')dmg*=0.90;
 if(tg.passives?.crystal&&tg.crystalCd<=0&&tg.hp-dmg<tg.maxHp*0.3&&tg.hp-dmg>0&&tg.type==='hero'){
  tg.shield=(tg.shield||0)+300;tg.crystalCd=20;
  addText(tg.x,tg.y-40,'💎+300','#44aaff');addRing(tg.x,tg.y,'#44aaff',60,0.6);
 }
 if(tg.shield>0){
  const abs=Math.min(tg.shield,dmg);tg.shield-=abs;dmg-=abs;
  if(tg.shield<=0)tg.shield=0;
  addRing(tg.x,tg.y,tg.shieldColor||'#88ddff',25,0.3);
  if(dmg<=0)return;
 }
 tg.hp-=dmg;
 if(tg.type==='ancient'||tg.type==='tower')tg.lastHurtT=S.time;
 if(!silent){
  S.effects.push({x:tg.x,y:tg.y,t:0.2,max:0.2,color:'#fff'});
  S.damageNums.push({x:tg.x+(Math.random()-0.5)*24,y:tg.y-24,text:Math.round(dmg),t:0.8,max:0.8,vy:-45,color:'#ffbbbb'});
 }
 if(killer&&killer.type==='hero'&&killer!==tg&&tg.type==='hero'){
  const pk=killer.heroDef.perk;
  if(pk==='freeze')applySlow(tg,0.2,1);
  if(pk==='ignite')applyBurn(tg,4,1.5);
 }
 if(killer&&killer.type==='hero'&&killer!==tg&&killer.team!==tg.team){
  if(killer.passives?.vamp){const h=dmg*0.08;killer.hp=Math.min(killer.maxHp,killer.hp+h);}
  if(killer.items?.lifesteal){const h=dmg*killer.items.lifesteal;killer.hp=Math.min(killer.maxHp,killer.hp+h);}
  if(tg.passives?.reflect){const r=dmg*0.15;killer.hp-=r;addText(killer.x,killer.y-30,'-'+Math.round(r),'#ff88ff');}
  if(killer.passives?.poison&&tg.type==='hero')applyBurn(tg,8,2);
  if(killer.passives?.frost&&tg.type==='hero')applySlow(tg,0.25,1);
 }
 if(tg.hp<=0){
  tg.hp=0;tg.alive=false;
  if(tg.isSummon){addBurst(tg.x,tg.y,tg.color,30);return;}
  if(tg===S.player||tg===S.enemy){
   const dead=tg,other=dead===S.player?S.enemy:S.player;
   dead.deaths++;const victimStreak=dead.streak||0;dead.streak=0;
   if(other){other.kills++;other.streak++;other.maxStreak=Math.max(other.maxStreak,other.streak);
    if(other.heroDef.perk==='wings'){other.wingTimer=3;addText(other.x,other.y-40,'🪽⚡','#ffaa22');}
   }
   let bounty=60+victimStreak*STREAK;
   let phaseBonus=false;
   if(dead===S.enemy&&S.phase==='day'){bounty=Math.round(bounty*PHASE_BOUNTY_MULT);phaseBonus=true;}
   if(dead===S.player&&S.phase==='night'){bounty=Math.round(bounty*PHASE_BOUNTY_MULT);phaseBonus=true;}
   if(dead===S.enemy){
    S.gold+=bounty;
    if(phaseBonus){showMsg('★ БОНУС ВРЕМЕНИ! +'+bounty+'g');SFX.shutdown();}
    else if(victimStreak>=3){showMsg('★ SHUTDOWN! +'+bounty+'g');SFX.shutdown();}
    else showMsg('Убийство! +'+bounty+'g');
   }else{
    S.enemy.gold=(S.enemy.gold||0)+bounty;
    const lost=Math.min(Math.floor(S.gold),bounty);S.gold-=lost;
    if(phaseBonus){showMsg('☠ ВРАГ УБИЛ В СВОЁ ВРЕМЯ! -'+lost+'g');SFX.shutdown();}
    else if(victimStreak>=3){showMsg('☠ ТЕБЯ ЗАБРАЛИ! -'+lost+'g');SFX.shutdown();}
    else showMsg('Ты погиб');
   }
   dead.respawnTimer=RESPAWN;
   dead.target=null;dead.moveTo=null;
   dead.x=dead.team==='P'?S.ancients[0].x+30:S.ancients[1].x-30;dead.y=LANE;
   SFX.death();return;
  }
  if(tg.team==='E'&&tg.type==='creep'){
   const baseRew=12+S.waveNum*4;
   const rew=S.player.passives?.luck?Math.round(baseRew*1.2):baseRew;
   S.gold+=rew;SFX.hit();
   if(killer===S.player&&S.player.heroDef.perk==='soul'&&!tg.isSummon){S.player.maxHp+=1;S.player.hp+=1;}
  }
  if(tg.team==='P'&&tg.type==='creep'){
   const baseRew=12+S.waveNum*4;
   const rew=S.enemy.passives?.luck?Math.round(baseRew*1.2):baseRew;
   S.enemy.gold=(S.enemy.gold||0)+rew;
   if(killer===S.enemy&&S.enemy.heroDef.perk==='soul'&&!tg.isSummon){S.enemy.maxHp+=1;S.enemy.hp+=1;}
  }
  if(tg.team==='E'&&tg.type==='tower'){S.gold+=40;showMsg('+40g — башня!');SFX.death();addBurst(tg.x,tg.y,'#ff8844',80);weakenCreeps('P');}
  else if(tg.team==='E'&&tg.type==='ancient'){S.gold+=100;S.victoryTimer=2.5;S.victoryExplodeTimer=0;S.victoryAnc=tg;showMsg('ДРЕВНИЙ ВРАГА РАЗРУШЕН!');SFX.boom();}
  if(tg.team==='P'&&tg.type==='tower'){showMsg('ТВОЯ БАШНЯ ПАЛА!');addBurst(tg.x,tg.y,'#ff4444',80);SFX.death();weakenCreeps('E');}
  if(tg.team==='P'&&tg.type==='ancient'){S.defeatTimer=2.5;S.defeatExplodeTimer=0;S.defeatAnc=tg;showMsg('ТВОЙ ДРЕВНИЙ ПАЛ!');SFX.lose();}
 }
}

function attack(u,t){
 if(!t||t.hp<=0||u.stunTime>0)return;
 const baseAtkCd=u.type==='creep'?1:u.type==='tower'?1.4:u.type==='ancient'?ANC_CD:(u.atkSpeed||0.9);
 u.atkCd=u.type==='hero'?Math.max(0.3,baseAtkCd*(1-(u.items?.attackSpeed||0))):baseAtkCd;
 let dmg=u.dmg+(u.items?u.items.dmg:0)+(u.buffDmg||0);
 if(u.type==='hero'&&(u.items?.crit||0)>0&&Math.random()<u.items.crit){dmg*=1.75;addText(u.x,u.y-42,'КРИТ!','#ffcc44');}
 let c='#fff';
 if(u.type==='tower')c=u.team==='P'?'#ff8899':'#8899ff';
 else if(u.type==='ancient')c=u.team==='P'?'#ff3344':'#3344ff';
 else if(u.type==='creep')c=u.color||(u.team==='P'?'#ffcc88':'#88ccff');
 else c=u.team==='P'?'#ffdd44':'#dd44ff';
 fire(u,t,c,dmg,u);
 if(u.type==='ancient'){SFX.ancient();addRing(u.x,u.y,c,60,0.5);}else SFX.atk();
}

function allEnemies(team){
 const a=[];
 if(team==='P'){
  a.push(...S.creeps.filter(c=>c.team==='E'&&c.hp>0&&c.alive));
  a.push(...S.towers.filter(t=>t.team==='E'&&t.hp>0&&t.alive));
  a.push(...S.ancients.filter(x=>x.team==='E'&&x.hp>0&&x.alive));
  if(S.enemy.hp>0&&S.enemy.alive)a.push(S.enemy);
 }else{
  a.push(...S.creeps.filter(c=>c.team==='P'&&c.hp>0&&c.alive));
  a.push(...S.towers.filter(t=>t.team==='P'&&t.hp>0&&t.alive));
  a.push(...S.ancients.filter(x=>x.team==='P'&&x.hp>0&&x.alive));
  if(S.player.hp>0&&S.player.alive)a.push(S.player);
 }
 return a;
}
function nearest(u,list,maxR){
 let best=null,bd=maxR||Infinity;
 for(const e of list){const d=d2(u,e);if(d<bd){bd=d;best=e;}}
 return best;
}

function castAbility(p,key){
 if(!p||!p.alive||S.gameOver||S.paused)return false;
 if(!p.abilUnlocked[key])return false;
 if(p.cd[key]>0||p.stunTime>0)return false;
 const A=p.heroDef.abil[key];
 if(!A||p.mana<A.cost)return false;
 const enemies=allEnemies(p.team).filter(e=>e.type!=='tower');
 let target=null;
 if(p.target&&p.target.type!=='tower'&&p.target.hp>0&&p.target.alive)target=p.target;
 if(!target)target=nearest(p,enemies,ABIL_MAX_RANGE);
 if(!target)target=nearest(p,enemies,Infinity);
 const type=A.type;let used=false;

 if(type==='damage'){
  if(!target)return false;
  addBeam(p.x,p.y,target.x,target.y,p.color,0.4,4);
  fire(p,target,p.color,A.dmg,p);
  if(A.slow)applySlow(target,A.slow,A.slowDur);
  if(A.stun)applyStun(target,A.stun);
  if(A.burn)applyBurn(target,A.burn,A.burnDur||3);
  if(A.lifesteal){const h=A.dmg*A.lifesteal;p.hp=Math.min(p.maxHp,p.hp+h);addText(p.x,p.y-30,'+'+Math.round(h)+'❤','#88ff88');}
  used=true;
 }
 else if(type==='shield'){p.shield=Math.max(p.shield||0,A.shield);p.shieldTimer=A.dur;p.shieldColor='#88ddff';addShield(p,A.dur,'#88ddff',30);addText(p.x,p.y-30,'+'+A.shield+'🛡','#88ddff');used=true;}
 else if(type==='heal_shield'){p.hp=Math.min(p.maxHp,p.hp+A.heal);p.shield=Math.max(p.shield||0,A.shield);p.shieldTimer=A.dur;p.shieldColor='#aaaaaa';addShield(p,A.dur,'#aaaaaa',30);addBurst(p.x,p.y,'#88ff88',60);addText(p.x,p.y-30,'+'+A.heal+'❤','#88ff88');used=true;}
 else if(type==='hot'){p.hotAmount=A.heal/A.dur;p.hotTime=A.dur;addAura(p,A.dur,'#88ff88',30);addText(p.x,p.y-30,'+'+A.heal+'❤/'+A.dur+'с','#88ff88');used=true;}
 else if(type==='haste'){p.hasteTime=A.dur;p.hasteMult=A.mult||1.8;addAura(p,A.dur,'#44aaff',30);addText(p.x,p.y-30,'⚡','#44aaff');used=true;}
 else if(type==='buffDmg'){p.buffDmg=A.bonus;p.buffDmgTimer=A.dur;addAura(p,A.dur,'#ff4444',30);addText(p.x,p.y-30,'+'+A.bonus+' DMG','#ff4444');used=true;}
 else if(type==='teleport'){
  let tx=p.x,ty=p.y;
  if(target){const d=d2(p,target);if(d>0){const r=Math.max(0,d-150)/d;tx=p.x+(target.x-p.x)*(1-r);ty=p.y+(target.y-p.y)*(1-r);}}
  else tx=p.x+(p.team==='P'?A.distance:-A.distance);
  addBurst(p.x,p.y,'#aa44ff',50);p.x=tx;p.y=ty;clampP(p);addBurst(p.x,p.y,'#aa44ff',50);used=true;
 }
 else if(type==='teleport_damage'){
  let tx=p.x,ty=p.y;
  if(target){const d=d2(p,target);if(d>0){const r=Math.max(0,d-150)/d;tx=p.x+(target.x-p.x)*(1-r);ty=p.y+(target.y-p.y)*(1-r);}}
  else tx=p.x+(p.team==='P'?A.distance:-A.distance);
  addBurst(p.x,p.y,p.color,50);p.x=tx;p.y=ty;clampP(p);
  addBurst(p.x,p.y,p.color,70);addRing(p.x,p.y,p.color,80,0.5);
  for(const e of enemies)if(d2(p,e)<80)applyDmg(e,A.dmg,p);
  used=true;
 }
 else if(type==='aoe'){
  const hit=enemies.filter(e=>d2(p,e)<A.radius);
  for(const e of hit){applyDmg(e,A.dmg,p);if(A.slow)applySlow(e,A.slow,A.slowDur);}
  addRing(p.x,p.y,p.color,A.radius,0.7);addRing(p.x,p.y,'#fff',A.radius*0.6,0.5);used=true;
 }
 else if(type==='aoe_burn'){
  const hit=enemies.filter(e=>d2(p,e)<A.radius);
  for(const e of hit){applyDmg(e,A.dmg,p);if(A.burn)applyBurn(e,A.burn,A.burnDur||3);}
  addRing(p.x,p.y,p.color,A.radius,0.7);addRing(p.x,p.y,'#ffcc44',A.radius*0.6,0.6);used=true;
 }
 else if(type==='aoe_lifesteal'){
  const hit=enemies.filter(e=>d2(p,e)<A.radius);
  let tot=0;for(const e of hit){applyDmg(e,A.dmg,p);tot+=A.dmg;}
  const h=tot*A.lifesteal;p.hp=Math.min(p.maxHp,p.hp+h);
  if(h>0)addText(p.x,p.y-30,'+'+Math.round(h)+'❤','#88ff88');
  addRing(p.x,p.y,p.color,A.radius,0.7);addRing(p.x,p.y,'#88ff88',A.radius*0.5,0.5);used=true;
 }
 else if(type==='aoe_stun'){
  const hit=enemies.filter(e=>d2(p,e)<A.radius);
  for(const e of hit){applyDmg(e,A.dmg,p);if(A.stun)applyStun(e,A.stun);}
  addRing(p.x,p.y,p.color,A.radius,0.7);used=true;
 }
 else if(type==='execute'){
  if(!target)return false;
  let dmg=A.dmg;
  if(target.hp/target.maxHp<A.threshold){dmg*=A.mult;addText(target.x,target.y-50,'КАЗНЬ!','#ff2222');}
  applyDmg(target,dmg,p);addBurst(target.x,target.y,'#ff2020',90);addRing(target.x,target.y,'#ff2020',60,0.5);used=true;
 }
 else if(type==='pierce'){
  const dir=target?Math.atan2(target.y-p.y,target.x-p.x):(p.team==='P'?0:Math.PI);
  const ex=p.x+Math.cos(dir)*A.length,ey=p.y+Math.sin(dir)*A.length;
  const hit=enemies.filter(e=>{
   const t=((e.x-p.x)*Math.cos(dir)+(e.y-p.y)*Math.sin(dir));
   if(t<0||t>A.length)return false;
   const px=p.x+t*Math.cos(dir)-e.x,py=p.y+t*Math.sin(dir)-e.y;
   return Math.hypot(px,py)<32;
  });
  for(const e of hit)applyDmg(e,A.dmg,p);
  addBeam(p.x,p.y,ex,ey,p.color,0.5,8);addBeam(p.x,p.y,ex,ey,'#fff',0.3,3);used=true;
 }
 else if(type==='stealth'){p.stealthTimer=A.dur;addAura(p,A.dur,'#44ffaa',28);addText(p.x,p.y-30,'НЕВИДИМ','#44ffaa');used=true;}
 else if(type==='stealth_haste'){p.stealthTimer=A.dur;p.hasteTime=A.dur;p.hasteMult=A.mult||1.8;addAura(p,A.dur,'#44ffaa',30);addText(p.x,p.y-30,'НЕВИДИМ+⚡','#44ffaa');used=true;}
 else if(type==='rain'){
  const cx=target?target.x:p.x,cy=target?target.y:p.y;
  for(let i=0;i<A.count;i++){
   const ang=Math.random()*Math.PI*2,r=Math.random()*A.radius;
   const dx=cx+Math.cos(ang)*r,dy=cy+Math.sin(ang)*r;
   S.delayed.push({timer:0.15+i*0.12,fn:()=>{
    addRing(dx,dy,'#aa44ff',42,0.4);
    for(const e of allEnemies(p.team))if(e.type!=='tower'&&d2({x:dx,y:dy},e)<42)applyDmg(e,A.dmg,p);
   }});
  }
  used=true;
 }
 else if(type==='summon'){
  const n=A.count||1;for(let i=0;i<n;i++)spawnSkeleton(p.x,p.y,p.team,A.duration);
  addRing(p.x,p.y,p.color,100,0.6);addText(p.x,p.y-40,'+'+n+' 💀','#aa88ff');used=true;
 }
 if(used){p.cd[key]=A.cd;p.mana-=A.cost;}
 return used;
}

function tryAbility(key){
 if(!S||!S.player||S.screen!=='PLAYING'||S.gameOver||S.paused||S.shopOpen)return;
 if(!S.player.alive)return;
 if(!S.player.abilUnlocked[key]){
  const left=Math.ceil(ABIL_UNLOCK[key]-S.time);
  showMsg(key.toUpperCase()+' откроется через '+left+'с');
  SFX.locked();return;
 }
 if(S.player.cd[key]>0){showMsg(key.toUpperCase()+' — кулдаун '+Math.ceil(S.player.cd[key])+'с');return;}
 if(S.player.stunTime>0){showMsg('Ты в стане');return;}
 const A=S.player.heroDef.abil[key];
 if(S.player.mana<A.cost){showMsg('Мало маны ('+A.cost+')');return;}
 const ok=castAbility(S.player,key);
 if(!ok)showMsg(key.toUpperCase()+': нет цели');
 else if(key==='r')SFX.ult();else SFX.abil();
}

function buyItem(id){
 if(!S||!S.player||S.gameOver||S.paused||S.shopOpen)return;
 const p=S.player;
 if(id==='potion'&&!p.alive){showMsg('Зелье можно купить только после возрождения');return;}
 const it=SHOP[id];
 if(!it)return;
 const cost=S.shopCost[id];
 if(S.gold<cost){showMsg('Мало золота ('+cost+'g)');return;}
 S.gold-=cost;
 if(id==='sword'){p.items.dmg+=7.5;showMsg('+7.5 к урону');}
 else if(id==='boots'){p.items.speed+=25;showMsg('+25 к скорости');}
 else if(id==='potion'){p.hp=p.maxHp;showMsg('Здоровье полностью восстановлено');}
 else if(id==='heart'){p.maxHp+=10;p.hp=Math.min(p.maxHp,p.hp+10);showMsg('+10 к максимальному HP');}
 else if(id==='regen'){p.items.regen+=2;showMsg('+2 HP восстановления в секунду');}
 p.shopBuys[id]=(p.shopBuys[id]||0)+1;
 S.shopCost[id]=it.baseCost+p.shopBuys[id]*it.step;
 SFX.buy();
}

function applyCatalogItem(p,it){
 if(!p||!it)return;
 const id=it.id;
 if(it.kind==='passive'){
  p.passiveBought[id]=true;
  p.passives[id]=true;
 }else if(id==='titanheart'){
  p.maxHp+=120;p.hp=Math.min(p.maxHp,p.hp+120);
 }else if(id==='manacrystal'){
  p.maxMana+=30;p.mana=Math.min(p.maxMana,p.mana+30);p.items.manaRegen+=1.5;
 }else if(id==='duelist')p.items.attackSpeed=Math.min(0.5,p.items.attackSpeed+0.15);
 else if(id==='berserker'||id==='warbanner')p.items.dmg+=id==='berserker'?12:18;
 else if(id==='bloodcharm')p.items.lifesteal=Math.min(0.5,p.items.lifesteal+0.08);
 else if(id==='hunter')p.items.crit=Math.min(0.5,(p.items.crit||0)+0.18);
 else if(id==='guardian')p.items.damageReduction=Math.min(0.5,(p.items.damageReduction||0)+0.10);
 else if(id==='shadowstep')p.items.speed+=18;
 else if(id==='moonstone'){
  p.maxMana+=40;p.mana=Math.min(p.maxMana,p.mana+40);p.items.manaRegen+=2;
 }
 else if(id==='dragonhide')p.items.damageReduction=Math.min(0.5,(p.items.damageReduction||0)+0.12);
 else if(id==='stormring')p.items.attackSpeed=Math.min(0.5,p.items.attackSpeed+0.12);
}

function buyShopItem(id){
 if(!S.player||S.gameOver||S.paused||!S.shopOpen)return;
 const it=SHOP_CATALOG_BY_ID[id];
 if(!it||!S.shopStock.includes(id))return;
 const p=S.player,spent=p.shopPurchaseCount||0;
 if(spent>=3){showMsg('Лимит магазина достигнут: 3 из 3');return;}
 if(p.shopPurchased[id]){showMsg('Этот предмет уже куплен');return;}
 if(S.gold<it.cost){showMsg('Мало золота ('+it.cost+'g)');return;}
 S.gold-=it.cost;
 applyCatalogItem(p,it);
 p.shopPurchased[id]=true;
 p.shopPurchaseCount=spent+1;
 showMsg('Реликвия получена: '+it.name+' · '+p.shopPurchaseCount+'/3');
 addText(p.x,p.y-50,it.icon+' '+it.name,'#d7b77a');
 addRing(p.x,p.y,'#a65c76',80,0.7);
 SFX.buy();
}
function enemyAutoBuy(u){
 if(!u||!u.alive||S.time-(u.lastBuyT||0)<2)return;
 u.lastBuyT=S.time;
 // Лимит 3 касается только реликвий из основного магазина.
 if((u.shopPurchaseCount||0)<3){
  const available=(S.shopStock||[]).map(id=>SHOP_CATALOG_BY_ID[id]).filter(it=>it&&!u.shopPurchased[it.id]&&it.cost<=u.gold);
  if(available.length){
   const it=available[Math.floor(Math.random()*available.length)];
   u.gold-=it.cost;applyCatalogItem(u,it);u.shopPurchased[it.id]=true;u.shopPurchaseCount=(u.shopPurchaseCount||0)+1;return;
  }
 }
 // Обычные улучшения покупаются отдельно и не расходуют лимит магазина.
 const nextCost=id=>SHOP[id].baseCost+(u.shopBuys[id]||0)*SHOP[id].step;
 if(u.maxHp<1400&&u.gold>=nextCost('heart')){
  u.gold-=nextCost('heart');u.maxHp+=10;u.hp=Math.min(u.maxHp,u.hp+10);u.shopBuys.heart++;return;
 }
 if(u.items.dmg<90&&u.gold>=nextCost('sword')){
  u.gold-=nextCost('sword');u.items.dmg+=7.5;u.shopBuys.sword++;return;
 }
 if(u.items.speed<100&&u.gold>=nextCost('boots')){
  u.gold-=nextCost('boots');u.items.speed+=25;u.shopBuys.boots++;return;
 }
 if(u.items.regen<14&&u.gold>=nextCost('regen')){
  u.gold-=nextCost('regen');u.items.regen+=2;u.shopBuys.regen++;return;
 }
}
function tickStatus(u,dt){
 if(u.stunTime>0)u.stunTime-=dt;
 if(u.slowTime>0)u.slowTime-=dt;
 if(u.hasteTime>0)u.hasteTime-=dt;
 if(u.wingTimer>0)u.wingTimer-=dt;
 if(u.buffDmgTimer>0){u.buffDmgTimer-=dt;if(u.buffDmgTimer<=0)u.buffDmg=0;}
 if(u.shieldTimer>0){u.shieldTimer-=dt;if(u.shieldTimer<=0){u.shield=0;u.shieldColor='#88ddff';}}
 if(u.stealthTimer>0)u.stealthTimer-=dt;
 if(u.hotTime>0){u.hotTime-=dt;u.hp=Math.min(u.maxHp,u.hp+u.hotAmount*dt);}
 if(u.burnTime>0){u.burnTime-=dt;applyDmg(u,u.burnAmount*dt,null,true);}
 if(u.crystalCd>0)u.crystalCd-=dt;
 if(u.type==='hero'&&u.heroDef&&u.heroDef.perk==='bless'&&u.alive){
  u.hp=Math.min(u.maxHp,u.hp+3*dt);
 }
}

function updHero(u,dt){
 if(!u.alive){updRespawn(u,dt);return;}
 tickStatus(u,dt);
 if(u.atkCd>0)u.atkCd-=dt;
 for(const k in u.cd)if(u.cd[k]>0)u.cd[k]-=dt;
 u.mana=Math.min(u.maxMana,u.mana+(RG_MP+(u.items?.manaRegen||0))*dt);
 const own=u.team==='P'?S.ancients[0]:S.ancients[1];
 const inOwn=d2(u,own)<HEAL_R;
 if(!inOwn)u.hp=Math.min(u.maxHp,u.hp+(RG_HP+(u.items?u.items.regen:0))*dt);
 if(u.stunTime>0)return;
 if(u===S.player){
  if(u.moveTo){if(d2(u,u.moveTo)<6)u.moveTo=null;else mvT(u,u.moveTo,dt);return;}
  if(u.target&&u.target.hp>0&&u.target.alive){
   const d=d2(u,u.target);
   if(d>u.range)mvT(u,u.target,dt);
   else if(u.atkCd<=0)attack(u,u.target);
   return;
  }
  u.target=null;
  const near=nearest(u,allEnemies('P'),u.range);
  if(near&&u.atkCd<=0)attack(u,near);
  return;
 }
 aiHero(u,dt);
}

function aiHero(u,dt){
 if(u.stunTime>0)return;
 enemyAutoBuy(u);
 const eF=S.ancients[0];
 if(d2(u,eF)<HEAL_R+40){u.target=null;mvT(u,{x:700,y:LANE},dt);return;}
 if(u.hp<u.maxHp*0.5&&u.abilUnlocked.w&&u.cd.w<=0&&u.mana>=u.heroDef.abil.w.cost){
  if(Math.random()<0.05)castAbility(u,'w');
 }
 if(u.hp<u.maxHp*0.2){u.target=null;mvT(u,{x:800,y:LANE},dt);return;}
 const enemies=allEnemies('E');
 const near=nearest(u,enemies,280);
 if(near){
  u.target=near;
  const d=d2(u,near);
  if(d>u.range)mvT(u,near,dt);
  else if(u.atkCd<=0)attack(u,near);
  if(d<260&&u.abilUnlocked.q&&u.cd.q<=0&&u.mana>=u.heroDef.abil.q.cost&&Math.random()<0.05)castAbility(u,'q');
  if(d<260&&u.abilUnlocked.r&&u.cd.r<=0&&u.mana>=u.heroDef.abil.r.cost&&Math.random()<0.02)castAbility(u,'r');
  return;
 }
 const tw=S.towers.find(t=>t.team==='P'&&t.hp>0);
 if(tw){const d=d2(u,tw);if(d>u.range)mvT(u,tw,dt);else if(u.atkCd<=0)attack(u,tw);}
 else{const anc=S.ancients[0];if(anc.hp>0){const d=d2(u,anc);if(d>u.range)mvT(u,anc,dt);else if(u.atkCd<=0)attack(u,anc);}}
}

function updUnit(u,dt){
 if(u.hp<=0||!u.alive)return;
 tickStatus(u,dt);
 if(u.atkCd>0)u.atkCd-=dt;
 if(u.stunTime>0)return;
 if(u.type==='ancient'){
  const idle=S.time-(u.lastHurtT||-99);
  if(idle>ANC_REGEN_DELAY&&u.hp<u.maxHp){
   const before=u.hp;
   u.hp=Math.min(u.maxHp,u.hp+ANC_REGEN*dt);
   if(Math.floor(before/30)!==Math.floor(u.hp/30))u.healFx=0.6;
  }
  if(u.healFx>0)u.healFx-=dt;
 }
 const canMove=u.type==='creep';
 const enemies=allEnemies(u.team);
 let target;
 if(u.type==='ancient'){
  const inRange=enemies.filter(e=>d2(u,e)<=u.range);
  const wasInside=u.aggroInside||new Set();
  const justEntered=inRange.filter(e=>!wasInside.has(e));
  u.aggroInside=new Set(inRange);
  const locked=u.aggroTarget;
  if(locked&&(!locked.alive||locked.hp<=0||locked.team===u.team||d2(u,locked)>u.range)){
   u.aggroTarget=null;
  }
  // Приоритет получает тот, кто первым вошёл в радиус; фонтан держит цель до смерти или выхода из радиуса.
  if(!u.aggroTarget)u.aggroTarget=justEntered[0]||nearest(u,inRange,u.range);
  target=u.aggroTarget;
 }else{
  target=(u.target&&u.target.hp>0&&u.target.alive)?u.target:nearest(u,enemies,u.range+40);
 }
 if(target){
  const d=d2(u,target);
  if(d>u.range){if(canMove)mvT(u,target,dt);}
  else if(u.atkCd<=0)attack(u,target);
 }else if(u.type==='creep'){
  const base=u.team==='P'?S.ancients[1]:S.ancients[0];
  mvT(u,base,dt);
 }
}

function update(dt){
 if(S.screen!=='PLAYING'||S.gameOver||S.paused||S.shopOpen)return;
 if(S.victoryTimer>0){
  S.victoryTimer-=dt;S.victoryExplodeTimer-=dt;
  if(S.victoryExplodeTimer<=0){
   S.victoryExplodeTimer=0.15;
   const a=S.victoryAnc,ex=a.x+(Math.random()-0.5)*80,ey=a.y+(Math.random()-0.5)*80;
   addBurst(ex,ey,Math.random()<0.5?'#ffaa22':'#ff4422',70);addRing(ex,ey,'#ffaa22',60,0.5);SFX.boom();
  }
  updFx(dt);
  if(S.victoryTimer<=0){S.gameOver='WIN';S.screen='GAME_OVER';SFX.win();}
  return;
 }
 if(S.defeatTimer>0){
  S.defeatTimer-=dt;S.defeatExplodeTimer-=dt;
  if(S.defeatExplodeTimer<=0){
   S.defeatExplodeTimer=0.15;
   const a=S.defeatAnc,ex=a.x+(Math.random()-0.5)*80,ey=a.y+(Math.random()-0.5)*80;
   addBurst(ex,ey,Math.random()<0.5?'#ff6622':'#882222',70);addRing(ex,ey,'#882222',60,0.5);SFX.boom();
  }
  updFx(dt);
  if(S.defeatTimer<=0){S.gameOver='LOSE';S.screen='GAME_OVER';}
  return;
 }
 S.time+=dt;
 if(S.msgT>0)S.msgT-=dt;
 updatePhase(dt);
 checkUnlocks(dt);
 S.waveT-=dt;
 if(S.waveT<=0){spawnWave();S.waveT=20;}
 S.gold+=1*dt;
 S.enemy.gold=(S.enemy.gold||0)+1*dt;
 updHero(S.player,dt);
 updHero(S.enemy,dt);
 for(const u of S.creeps)updUnit(u,dt);
 for(const t of S.towers)updUnit(t,dt);
 for(const a of S.ancients)updUnit(a,dt);
 updFountain(dt);
 updProj(dt);
 updFx(dt);
 for(let i=S.delayed.length-1;i>=0;i--){
  S.delayed[i].timer-=dt;
  if(S.delayed[i].timer<=0){S.delayed[i].fn();S.delayed.splice(i,1);}
 }
 S.creeps=S.creeps.filter(c=>{
  if(c.isSummon){c.summonLife-=dt;if(c.summonLife<=0){addBurst(c.x,c.y,c.color,30);return false;}}
  return c.hp>0&&c.alive&&!isNaN(c.x)&&!isNaN(c.y);
 });
 S.targetMark=(S.player.target&&S.player.target.hp>0&&S.player.target.alive)?{x:S.player.target.x,y:S.player.target.y}:null;
}

function updFx(dt){
 for(let i=S.effects.length-1;i>=0;i--){
  const e=S.effects[i];e.t-=dt;
  if(e.type==='text')e.y+=(e.vy||0)*dt;
  if(e.t<=0)S.effects.splice(i,1);
 }
 for(let i=S.damageNums.length-1;i>=0;i--){
  const d=S.damageNums[i];d.t-=dt;d.y+=(d.vy||0)*dt;
  if(d.t<=0)S.damageNums.splice(i,1);
 }
}

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function resizeCanvasForSharpness(){
 const rect=cv.getBoundingClientRect();
 const displayScale=rect.width>0?rect.width/W:1;
 const pixelScale=Math.max(1,Math.min(3,(window.devicePixelRatio||1)*displayScale));
 const targetW=Math.round(W*pixelScale),targetH=Math.round(H*pixelScale);
 if(cv.width!==targetW||cv.height!==targetH){cv.width=targetW;cv.height=targetH;}
 ctx.setTransform(pixelScale,0,0,pixelScale,0,0);
 ctx.imageSmoothingEnabled=true;
 ctx.lineCap='round';ctx.lineJoin='round';
}
resizeCanvasForSharpness();
window.addEventListener('resize',resizeCanvasForSharpness,{passive:true});


function roundPanel(x,y,w,h,fill,stroke='#66513f',lineWidth=1.4,r=7){
 const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath();
 ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lineWidth;ctx.stroke();}
}
function drawWorldAtmosphere(){

 // Slow layers of battlefield mist.
 for(let i=0;i<4;i++){

  ctx.fillStyle=mist;ctx.fillRect(x-150,y-70,300,140);
 }
 // Thin ash motes drift through the air.
 for(let i=0;i<26;i++){

 }
}
function drawWorldFrame(){

 ctx.strokeStyle='rgba(149,111,76,.45)';ctx.lineWidth=1.2;ctx.strokeRect(5,5,W-10,H-10);

  ctx.beginPath();ctx.moveTo(x,500);ctx.lineTo(x+dir*10,510);ctx.lineTo(x,520);ctx.stroke();

function drawBg(){
 const base=ctx.createLinearGradient(0,0,0,H);base.addColorStop(0,'#101016');base.addColorStop(.48,'#1c171a');base.addColorStop(1,'#090a10');ctx.fillStyle=base;ctx.fillRect(0,0,W,H);
 const moon=ctx.createRadialGradient(450,165,10,450,165,350);moon.addColorStop(0,'rgba(105,82,89,.20)');moon.addColorStop(1,'rgba(10,9,14,0)');ctx.fillStyle=moon;ctx.fillRect(0,0,W,H);
 // Distant broken battlements and needle-like gothic spires.

   ctx.fillStyle='#d6bd98';ctx.font='bold 19px Georgia';ctx.fillText(u.name,x+cardW/2,ly+27);
   ctx.fillStyle='#a99a8d';ctx.font='italic 11px Georgia';ctx.fillText(u.heroDef.perkText,x+cardW/2,ly+50);
   ctx.fillStyle='#9e514d';ctx.font='bold 12px Georgia';ctx.fillText(label,x+cardW/2,ly+78);
   ctx.fillStyle='#d7c5a9';ctx.font='bold 27px Georgia';
   ctx.fillText('⚔ '+u.kills,x+cardW/2-65,ly+119);
   ctx.fillStyle='#9e9aa0';ctx.fillText('☠ '+u.deaths,x+cardW/2+65,ly+119);
  }
  fighterCard(p,lx,p.color,'ВОИН СВЕТА');
  fighterCard(e,rx,e.color,'ВОИН ТЬМЫ');

  const info=PHASE_INFO[S.phase];
  ctx.fillStyle='#c59a65';ctx.font='bold 15px Georgia';
  ctx.fillText(info.icon+'  '+info.name+' · '+Math.ceil(S.phaseTime)+'с',W/2,326);
  if(S.phase!=='sunset'){
   ctx.fillStyle='#b8a58c';ctx.font='12px Georgia';
   ctx.fillText('Благословение времени: +3 к урону, HP, скорости и дальности — '+(S.phaseOwner==='P'?'ИГРОК':'ВРАГ'),W/2,348);
  }
  ctx.fillStyle='#8e8178';ctx.font='12px Georgia';
  ctx.fillText('Способности открываются: Q · 10с     W · 25с     E · 40с     R · 60с',W/2,374);

  const b1={x:W/2-215,y:411,w:200,h:58},b2={x:W/2+15,y:411,w:200,h:58};
  const bg1=ctx.createLinearGradient(b1.x,b1.y,b1.x,b1.y+b1.h);
  bg1.addColorStop(0,'#56302e');bg1.addColorStop(1,'#211316');
  roundPanel(b1.x,b1.y,b1.w,b1.h,bg1,'#b17b5b',1.8,6);
  ctx.fillStyle='#ead1a5';ctx.font='bold 17px Georgia';ctx.fillText('ВОЗОБНОВИТЬ',b1.x+b1.w/2,b1.y+b1.h/2);
  const bg2=ctx.createLinearGradient(b2.x,b2.y,b2.x,b2.y+b2.h);
  bg2.addColorStop(0,'#343039');bg2.addColorStop(1,'#151319');
  roundPanel(b2.x,b2.y,b2.w,b2.h,bg2,'#78604f',1.8,6);
  ctx.fillStyle='#c9b39a';ctx.font='bold 16px Georgia';ctx.fillText('НАЧАТЬ ЗАНОВО',b2.x+b2.w/2,b2.y+b2.h/2);

  ctx.fillStyle='#76685f';ctx.font='11px Georgia';
  ctx.fillText('ESC — пауза  ·  Q W E R — способности  ·  ЛКМ — движение и атака',W/2,505);
  ctx.restore();
}

function drawHeroSelect(){
 const g=ctx.createRadialGradient(W/2,170,25,W/2,300,700);g.addColorStop(0,'#292029');g.addColorStop(.5,'#121116');g.addColorStop(1,'#050609');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // Thin cathedral-like rays and sigil.
 ctx.save();ctx.translate(W/2,280);ctx.strokeStyle='rgba(166,119,79,.13)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,235,0,Math.PI*2);ctx.arc(0,0,255,0,Math.PI*2);ctx.stroke();for(let i=0;i<16;i++){const a=i*Math.PI/8;ctx.beginPath();ctx.moveTo(Math.cos(a)*210,Math.sin(a)*210);ctx.lineTo(Math.cos(a)*255,Math.sin(a)*255);ctx.stroke();}ctx.restore();
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#d9bc91';ctx.font='bold 35px Georgia';ctx.shadowColor='rgba(178,102,90,.38)';ctx.shadowBlur=16;ctx.fillText('КРОВАВАЯ ЛИНИЯ',W/2,30);ctx.shadowBlur=0;
 ctx.fillStyle='#b0a193';ctx.font='11px Georgia';ctx.fillText('ИЗБЕРИ ЧЕМПИОНА · ЛКМ ДЛЯ ВЫБОРА',W/2,60);
 ctx.fillStyle='#857a75';ctx.font='10px Georgia';ctx.fillText('Q W E R — способности · ЛКМ по земле — движение · ЛКМ по врагу — атака',W/2,81);
 const rects=cardRects();
 for(let i=0;i<8;i++){
  const h=HEROES[i],r=rects[i],hov=heroHoverIdx===i;const cg=ctx.createLinearGradient(r.x,r.y,r.x,r.y+r.h);cg.addColorStop(0,hov?'#382a31':'#221e25');cg.addColorStop(1,'#0e0f14');
  roundPanel(r.x,r.y,r.w,r.h,cg,hov?h.color:'#5c4a48',hov?2.8:1.1,7);
  ctx.save();ctx.shadowColor=h.color;ctx.shadowBlur=hov?18:7;ctx.fillStyle=h.color;ctx.beginPath();ctx.arc(r.x+41,r.y+37,17,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.strokeStyle='#e0c7a3';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(r.x+41,r.y+37,17,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#17131a';ctx.font='bold 15px Georgia';ctx.textAlign='center';ctx.fillText('✦',r.x+41,r.y+42);
  ctx.textAlign='left';ctx.fillStyle=h.color;ctx.font='bold 13px Georgia';ctx.fillText(h.name,r.x+68,r.y+27);
  ctx.fillStyle='#9e9189';ctx.font='9px Georgia';ctx.fillText(h.tag,r.x+68,r.y+44);
  ctx.fillStyle='#c9b99f';ctx.font='italic 9px Georgia';ctx.fillText(h.perkText,r.x+10,r.y+78);
  ctx.font='9px Georgia';ctx.fillStyle='#d0c5b8';ctx.fillText('HP '+h.hp+'  ·  DMG '+h.dmg,r.x+10,r.y+97);ctx.fillText('RNG '+h.range+'  ·  SPD '+h.speed,r.x+10,r.y+111);
  const keys=['q','w','e','r'];for(let j=0;j<4;j++){const a=h.abil[keys[j]],bx=r.x+12+j*45,by=r.y+120;const bg=ctx.createLinearGradient(bx,by,bx,by+34);bg.addColorStop(0,'#3b3036');bg.addColorStop(1,'#15131a');roundPanel(bx,by,38,34,bg,'#665248',.8,3);ctx.textAlign='center';ctx.font='16px Georgia';ctx.fillStyle='#dfd0bd';ctx.fillText(a.icon,bx+19,by+19);ctx.fillStyle='#d8b477';ctx.font='bold 9px Georgia';ctx.textAlign='left';ctx.fillText(keys[j].toUpperCase(),bx+3,by+7);}
 }
 ctx.textAlign='center';ctx.fillStyle='#8e8277';ctx.font='10px Georgia';ctx.fillText('ВОЙДИ ВО МРАК · ВЫБЕРИ СВОЮ СУДЬБУ',W/2,585);
}
function drawGameOver(){
 const bg=ctx.createRadialGradient(W/2,240,20,W/2,300,500);bg.addColorStop(0,'rgba(36,22,27,.96)');bg.addColorStop(1,'rgba(4,5,8,.98)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='rgba(159,116,80,.55)';ctx.lineWidth=1.5;ctx.strokeRect(22,22,W-44,H-44);
 ctx.textAlign='center';ctx.textBaseline='middle';
 if(S.gameOver==='WIN'){ctx.fillStyle='#dfbe89';ctx.font='bold 62px Georgia';ctx.fillText('ПОБЕДА',W/2,142);ctx.fillStyle='#b8a99a';ctx.font='15px Georgia';ctx.fillText('Древний врага пал, проклятие рассеяно',W/2,205);}
 else{ctx.fillStyle='#bd777c';ctx.font='bold 58px Georgia';ctx.fillText('ПОРАЖЕНИЕ',W/2,142);ctx.fillStyle='#b8a99a';ctx.font='15px Georgia';ctx.fillText('Твой древний пал во тьме',W/2,205);}
 const p=S.player,e=S.enemy;ctx.fillStyle=p.color;ctx.font='bold 14px Georgia';ctx.fillText(p.name+' · Убийства '+p.kills+' · Смерти '+p.deaths,W/2-170,268);ctx.fillStyle=e.color;ctx.fillText(e.name+' · Убийства '+e.kills+' · Смерти '+e.deaths,W/2+170,268);
 ctx.fillStyle='#b1a69b';ctx.font='13px Georgia';ctx.fillText('Время: '+Math.floor(S.time)+'с · Волн: '+S.waveNum,W/2,316);
 const btn={x:W/2-220,y:370,w:200,h:62},btn2={x:W/2+20,y:370,w:200,h:62};
 const b1=ctx.createLinearGradient(btn.x,btn.y,btn.x,btn.y+btn.h);b1.addColorStop(0,'#4d3034');b1.addColorStop(1,'#1b1218');roundPanel(btn.x,btn.y,btn.w,btn.h,b1,'#a16c62',1.7,6);
 ctx.fillStyle='#e0c29a';ctx.font='bold 19px Georgia';ctx.fillText('СНОВА В БОЙ',btn.x+btn.w/2,btn.y+btn.h/2+1);
 const b2=ctx.createLinearGradient(btn2.x,btn2.y,btn2.x,btn2.y+btn2.h);b2.addColorStop(0,'#292d43');b2.addColorStop(1,'#12141d');roundPanel(btn2.x,btn2.y,btn2.w,btn2.h,b2,'#6d7393',1.7,6);
 ctx.fillStyle='#c0c5d7';ctx.fillText('К ГЕРОЯМ',btn2.x+btn2.w/2,btn2.y+btn2.h/2+1);
}

function drawIntroBanner(){
  if(!S||S.introBannerT<=0)return;
  const progress=1-S.introBannerT/3;
  const fade=Math.min(1,progress*5,(S.introBannerT)*2.2);
  ctx.save();
  ctx.globalAlpha=Math.max(0,Math.min(1,fade));
  const y=H/2;
  const glow=ctx.createRadialGradient(W/2,y,8,W/2,y,270);
  glow.addColorStop(0,'rgba(105,0,12,.34)');glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=glow;ctx.fillRect(W/2-280,y-90,560,180);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='#9d0718';ctx.shadowBlur=28;
  ctx.fillStyle='#8f101e';ctx.font='bold 54px Georgia';
  ctx.fillText('Кровавая линия!',W/2,y);
  ctx.shadowBlur=7;ctx.fillStyle='#d7a0a0';ctx.font='bold 51px Georgia';
  ctx.fillText('Кровавая линия!',W/2,y-2);
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(150,35,42,.75)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(W/2-205,y+43);ctx.lineTo(W/2+205,y+43);ctx.stroke();
  ctx.restore();
}

function render(){
 ctx.fillStyle='#050208';ctx.fillRect(0,0,W,H);
 if(S.screen==='HERO_SELECT'){drawHeroSelect();return;}
 drawBg();
 drawDecor();
 drawWorldAtmosphere();
 drawFountain(S.ancients[0]);drawFountain(S.ancients[1]);
 drawUnit(S.ancients[0]);drawUnit(S.ancients[1]);
 drawUnit(S.towers[0]);drawUnit(S.towers[1]);
 for(const c of S.creeps)drawUnit(c);
 if(S.player.alive)drawUnit(S.player);
 if(S.enemy.alive)drawUnit(S.enemy);
 drawProj();drawFx();drawHover();drawDmgNums();drawMarks();
 drawPhaseOverlay();drawWorldFrame();
 drawHUD();drawButtons();
 drawPhasePill();drawPhaseBanner();
 if(S.shopOpen)drawShopOverlay();
 if(S.paused)drawPauseOverlay();
 if(S.gameOver)drawGameOver();
}

function entityAt(x,y){
 if(!S.player)return null;
 const all=[S.player,S.enemy,...S.creeps,...S.towers,...S.ancients];
 let best=null,bestD=Infinity;
 for(const e of all){
  if(!e||e.hp<=0||e.alive===false||isNaN(e.x)||isNaN(e.y))continue;
  const r=uR(e),d=d2(e,{x,y});
  if(d<r&&d<bestD){bestD=d;best=e;}
 }
 return best;
}

function handleClick(x,y){
 aud();
 if(S.screen==='HERO_SELECT'){
  const rects=cardRects();
  for(let i=0;i<8;i++)if(inR(x,y,rects[i])){startMatch(HEROES[i]);SFX.select();return;}
  return;
 }
 if(S.gameOver){
  if(inR(x,y,{x:W/2-220,y:370,w:200,h:62})){startMatch(S.player.heroDef);return;}
  if(inR(x,y,{x:W/2+20,y:370,w:200,h:62})){resetBase(null);return;}
  return;
 }
 if(S.shopOpen){
  const rects=shopCardRects();
  for(let i=0;i<6;i++)if(inR(x,y,rects[i])){buyShopItem(S.shopStock[i]);return;}
  const closeBtn={x:W/2-110,y:H-70,w:220,h:52};
  if(inR(x,y,closeBtn)){S.shopOpen=false;SFX.pause();return;}
  return;
 }
 if(inR(x,y,PAUSE_BTN)){S.paused=!S.paused;SFX.pause();return;}
 if(S.paused){
  if(inR(x,y,{x:W/2-220,y:400,w:200,h:62})){S.paused=false;SFX.pause();return;}
  if(inR(x,y,{x:W/2+20,y:400,w:200,h:62})){const hero=S.player.heroDef;resetBase(hero);SFX.select();return;}
  return;
 }
 if(inR(x,y,SHOP_OPEN_BTN)){S.shopOpen=true;SFX.openShop();return;}
 const keys=['q','w','e','r'];
 for(let i=0;i<4;i++){
  const r={x:ABIL_BTN.startX+i*(ABIL_BTN.w+ABIL_BTN.gap),y:ABIL_BTN.y,w:ABIL_BTN.w,h:ABIL_BTN.h};
  if(inR(x,y,r)){tryAbility(keys[i]);return;}
 }
 const quickIds=['sword','boots','potion','heart','regen'];
 for(let i=0;i<quickIds.length;i++){
  const r={x:SHOP_BTN.startX+i*(SHOP_BTN.w+SHOP_BTN.gap),y:SHOP_BTN.y,w:SHOP_BTN.w,h:SHOP_BTN.h};
  if(inR(x,y,r)){buyItem(quickIds[i]);return;}
 }
 if(!S.player.alive)return;
 if(y<55||y>515)return;
 const ent=entityAt(x,y);
 if(ent&&ent.team==='E'){S.player.target=ent;S.player.moveTo=null;SFX.select();return;}
 const tx=Math.max(MINX+3,Math.min(MAXX-3,x));
 const ty=Math.max(LANE-LH+3,Math.min(LANE+LH-3,y));
 S.player.moveTo={x:tx,y:ty};S.player.target=null;SFX.click();
}

function handleMove(x,y){
 if(!S)return;
 if(S.screen==='HERO_SELECT'){
  const rects=cardRects();heroHoverIdx=null;
  for(let i=0;i<8;i++)if(inR(x,y,rects[i])){heroHoverIdx=i;break;}
  return;
 }
 if(S.shopOpen){
  const rects=shopCardRects();shopHoverIdx=null;
  for(let i=0;i<6;i++)if(inR(x,y,rects[i])){shopHoverIdx=i;break;}
  return;
 }
 if(S.gameOver||!S.player||!S.player.alive||S.paused){hoverTarget=null;return;}
 if(y<55||y>515){hoverTarget=null;return;}
 const ent=entityAt(x,y);
 hoverTarget=(ent&&ent.team==='E')?ent:null;
}

function toLocal(e){
 const r=cv.getBoundingClientRect();
 return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};
}

cv.addEventListener('pointerdown',e=>{e.preventDefault();const p=toLocal(e);handleClick(p.x,p.y);},{passive:false});
cv.addEventListener('pointermove',e=>{const p=toLocal(e);handleMove(p.x,p.y);});
cv.addEventListener('pointerleave',()=>{hoverTarget=null;heroHoverIdx=null;shopHoverIdx=null;});

document.addEventListener('keydown',e=>{
 if(!S||S.screen!=='PLAYING')return;
 const k=(e.key||'').toLowerCase();
 // Используем физические коды клавиш: QWER работают и при русской раскладке.
 const abilityKey=({KeyQ:'q',KeyW:'w',KeyE:'e',KeyR:'r'})[e.code]||
  (['q','w','e','r'].includes(k)?k:null);
 if(k==='escape'||k===' '){
  if(S.gameOver)return;
  e.preventDefault();
  if(S.shopOpen){S.shopOpen=false;SFX.pause();return;}
  S.paused=!S.paused;SFX.pause();return;
 }
 if(S.paused||S.gameOver||S.shopOpen)return;
 if(e.repeat)return;
 if(abilityKey){e.preventDefault();tryAbility(abilityKey);}
});

let last=performance.now();
function loop(t){
 const dt=Math.min(0.05,(t-last)/1000);
 last=t;
 update(dt);
 render();
 requestAnimationFrame(loop);
}
resetBase(null);
requestAnimationFrame(loop);
})();
</script>
